[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cmcps"
version = "0.2.0"
description = "Read-only CERN/CMS MCP server with browser-backed SSO authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.28",
  "mcp[cli]>=2.3,<3",
  "playwright>=1.64",
  "pydantic>=2.11",
  "pydantic-settings>=2.11",
  "pymupdf>=1.26,<2",
]

[project.scripts]
cmcps = "cmcps.app:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "respx>=0.22",
  "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cmcps"]

# The obscura binary is downloaded at build time (git-ignored); hatchling only
# ships tracked files by default, so force-include it here.
artifacts = ["src/cmcps/_obscura/*"]

# Bundles the pinned obscura headless-browser binary (build platform) into
# src/cmcps/_obscura as wheel package data; sdist stays binary-free.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C90",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "RUF",
  "S",
  "UP",
  "W",
]
ignore = [
  "S101",
  "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
