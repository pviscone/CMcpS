[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cmsmcp"
version = "0.3.0"
description = "CERN/CMS MCP server: your CERN services as you, read by default, confirmed actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.28",
  "mcp[cli]>=2.3,<3",
  "playwright>=1.64",
  "pydantic>=2.11",
  "pydantic-settings>=2.11",
  "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
# `cmsmcp login` (Kerberos + terminal 2FA); building gssapi needs libkrb5-dev.
kerberos = ["gssapi>=1.8"]

[project.scripts]
cmsmcp = "cmsmcp.app:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "respx>=0.22",
  "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cmsmcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C90",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "RUF",
  "S",
  "UP",
  "W",
]
ignore = [
  "S101",
  "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S105", "S106"]
